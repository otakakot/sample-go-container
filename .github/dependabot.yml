version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      gomod:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /docker/multistage
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /docker/copy
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - '*'
